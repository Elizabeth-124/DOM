<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live DOM Manipulation</title>
    <!-- Bootstrap CSS for instant clean styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .badge-active {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }
        .highlight-card {
            border: 2px solid #3b82f6 !important;
            transform: scale(1.02);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-light p-5">


    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm border-0 rounded-3 p-4" id="studentCard">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <h2 class="h4 fw-bold mb-1" id="studentName">John Doe</h2>
                    <p class="text-muted small mb-0" id="courseTrack">Frontend UI Development</p>
                </div>
                <span class="badge rounded-pill px-3 py-2" id="statusBadge">Pending</span>
            </div>


            <hr>


            <p class="text-secondary small" id="statusMessage">
                Waiting for administrative approval to unlock Django & backend modules.
            </p>


            <div class="mt-3">
                <span class="small fw-semibold text-dark">Current Score: </span>
                <span class="fw-bold fs-5 text-primary" id="scoreDisplay">0%</span>
            </div>
        </div>
    </div>
    <div
        id="announcementBox">
    Announcement</div>


    <!-- Script loaded at the bottom so HTML is parsed first -->
    <script src="app.js"></script>
</body>
</html>
